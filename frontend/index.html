<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="190x176" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ SEO 元信息（v1.13.221）============
         背景：本站是登录墙 SPA，nginx 的 `location /` 把一切未命中静态文件的路径都
         try_files 回落本文件 ⇒ 此前 head 里仅有一个 title 标签，主域 / 在搜索结果中
         没有任何描述，社交平台分享也无卡片可展示。
         本批按营销页 /home/（独立静态页，自带完整 head）的口径补齐：
           • 与 robots.txt / sitemap.xml 的策略保持一致 —— 对外只开放 `/` 与 `/home/`
           • canonical 指向主域：SPA 各路由共用同一份 HTML，无法逐路由设 canonical，
             统一收敛到 / 与上述「只开放 / 与 /home/」的策略同源
           • og:image 复用 /home/assets/og-cover.jpg（同域、1200×630、已实测 200）
         ⚠️ 未知路径的 noindex **不写在这里**：静态 head 区分不了路由，写死会把主域
            一起压掉。改由 router 的 applyRobotsMeta 按 route.meta.noindex 客户端注入。 -->
    <title>选址赢家Online - WebGIS 商业智能分析平台</title>
    <meta name="description" content="选址赢家Online 是基于位置大数据的 WebGIS 商业智能分析平台：商圈人口分析、门店竞争洞察、开店余地评估、数据大屏驾驶舱与 AI 选址建议，帮连锁品牌把开店决策从「凭经验」变为「看数据」。">
    <link rel="canonical" href="https://mka-online.cn/">
    <meta name="theme-color" content="#1a1a2e">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="选址赢家Online">
    <meta property="og:title" content="选址赢家Online - WebGIS 商业智能分析平台">
    <meta property="og:description" content="商圈人口分析 · 门店竞争洞察 · 开店余地评估 · 数据大屏 · AI 选址建议">
    <meta property="og:url" content="https://mka-online.cn/">
    <meta property="og:image" content="https://mka-online.cn/home/assets/og-cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="选址赢家Online · 数据大屏驾驶舱">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="选址赢家Online - WebGIS 商业智能分析平台">
    <meta name="twitter:description" content="商圈人口分析 · 门店竞争洞察 · 开店余地评估 · 数据大屏 · AI 选址建议">
    <meta name="twitter:image" content="https://mka-online.cn/home/assets/og-cover.jpg">
    <meta name="twitter:image:alt" content="选址赢家Online · 数据大屏驾驶舱">

    <!-- v1.13.137：移除 unpkg CDN 外链（3 个 <link>）。Leaflet 与 MarkerCluster 样式改由使用方
         以 ESM 方式引入，随路由 chunk 自动注入：
           - leaflet/dist/leaflet.css        → MapView / DashboardView / DistrictInsightView /
                                                SmartstepsPanel
           - markercluster 的 2 个 css        → MapView（唯一使用 L.markerClusterGroup 的页面）
         收益：① 去掉对 unpkg 的硬依赖（外网 CDN 慢/挂会直接毁掉地图样式）
               ② 登录页/注册/重置密码不再加载 15KB 地图样式（login 首屏更干净）
         注意：新增使用 Leaflet 的页面时必须自行 import 'leaflet/dist/leaflet.css'。 -->

  </head>
  <body>
    <div id="app"></div>

    <!-- 无 JS 兜底（v1.13.221）：对不执行 JS 的抓取器 / 老旧浏览器，SPA 壳此前是彻底空的。
         给一段纯语义内容 + 指向营销页的内链，至少让品牌与能力可被读到。
         ⛔ 刻意不写内联 style 属性 —— nginx 下发的 CSP 对 style-src 同样收紧，
           属性写法会被静默拦截（与 218 批「内联 on*= 被拦」同一类坑）。
         ⚠️ JS 启用时 <noscript> 内容不参与渲染，对正常用户零影响。 -->
    <noscript>
      <h1>选址赢家Online</h1>
      <p>当前浏览器未启用 JavaScript，本站的交互功能无法加载。请启用后重新访问，或前往 <a href="/home/">产品主页</a> 了解平台能力。</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
