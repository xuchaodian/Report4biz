# ==============================================================================
# ⭐ v1.13.219（2026-10-13）：HTTP(80) → HTTPS 强制跳转
#   背景：本站此前只有 `listen 443 ssl`，⛔ 无任何 80 监听 ⇒ 用户输入
#         mka-online.cn（浏览器默认 http）直接「连接被拒」；外链/爬虫的
#         http 链接全部不可达。（阿里云安全组已确认放行 80）
#
#   🔴🔴 设计约束（改本段前必读）
#      ⛔ 绝不可在本 server 级写 `return 301`，必须放进 `location /` 内。
#      原因：certbot 用 authenticator=nginx 做 http-01 校验，会在本块
#      **临时插入** `location = /.well-known/acme-challenge/<token>`；
#      若 return 位于 server 级，rewrite 阶段先执行 ⇒ 把校验请求一并 301
#      掉 ⇒ 证书续期失败（而失败要到到期前 30 天才暴露）。
#   ✅ 已用 `certbot renew --dry-run` 验证校验路径（加块前/后各一次）。
# ==============================================================================
server {
    listen 80;
    server_name mka-online.cn www.mka-online.cn;

    server_tokens off;

    # 全部 80 流量 → 主域 https（含 www ⇒ 顺带把权重集中到主域）
    location / {
        return 301 https://mka-online.cn$request_uri;
    }
}

server {
    client_max_body_size 50m;
    listen 443 ssl;
    server_name mka-online.cn;

    # v1.13.139：隐藏 nginx 版本号（原响应头 Server: nginx/1.18.0 (Ubuntu) 泄露版本）
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mka-online.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mka-online.cn/privkey.pem;

    root /var/www/Report4biz/frontend/dist;
    index index.html;

    # 安全响应头（v1.13.139）
    # ⚠️ nginx 的 add_header 继承规则：子块一旦出现任何 add_header，父块的全部 add_header 都不再继承。
    #    本站各 location 都要写 Cache-Control，因此每个 location 必须显式 include 一次。
    include /etc/nginx/snippets/r4b-security.conf;

    # ① 带内容 hash 的构建产物（Vite assets/）→ 一年不可变缓存
    #    文件名随内容变化，长缓存绝对安全；回访用户 JS/CSS 零请求
    #    注：用 ^~ 前缀匹配，确保不被下面的正则 location 抢走
    location ^~ /assets/ {
        include /etc/nginx/snippets/r4b-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ② 不带 hash 的图片/字体（bg*.webp、favicon、地图预览图、leaflet 图钉）→ 协商缓存
    #    内容不变则 304 空响应，既省流量又保证换图即时生效
    location ~* \.(webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/r4b-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 官网主页（独立目录，位于 dist 同级，避免被前端部署清空）
    location = /home {
        return 301 /home/;
    }
    location ^~ /home/ {
        include /etc/nginx/snippets/r4b-security.conf;
        alias /var/www/Report4biz/frontend/home/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 上传文件（用户上传的品牌图标等，文件名带 hash 无扩展名）
    # 注：用 ^~ 避免被上面的图片正则抢走（否则 alias 失效变成 404）
    location ^~ /uploads/ {
        include /etc/nginx/snippets/r4b-security.conf;
        alias /var/www/Report4biz/backend/uploads/;
        add_header Cache-Control "no-cache" always;
    }

    # API 反向代理
    location /api/ {
        include /etc/nginx/snippets/r4b-security.conf;
        # 隐藏后端框架指纹（原响应头 X-Powered-By: Express）
        proxy_hide_header X-Powered-By;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 入口兜底 → index.html 每次重取（确保部署后立即拿到新入口，绝不缓存旧入口）
    # v1.13.139：删掉 expires -1s —— 它会生成一条 Cache-Control: no-cache，
    #            与下面的 add_header 叠加成「两条 Cache-Control」（审计报告 P2#5）
    location / {
        include /etc/nginx/snippets/r4b-security.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

# ==============================================================================
# ⭐ v1.13.219（2026-10-13）：www → 主域 301（统一域名 · 集中 SEO 权重）
#   前置：证书已扩 SAN 含 www（⛔ 否则 www 的 TLS 握手会因证书名不匹配直接失败）。
#   ⚠️ 本块必须位于「主域 443 块之后」—— 同端口的第一个 server 块是隐式
#      default_server，主域块必须保持 default（SNI 缺失/未知域名回落主域）。
#   ⚠️ ssl_certificate 不跨 server 块继承，本块必须自行声明证书路径。
# ==============================================================================
server {
    listen 443 ssl;
    server_name www.mka-online.cn;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mka-online.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mka-online.cn/privkey.pem;

    return 301 https://mka-online.cn$request_uri;
}
